name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            back-end/package-lock.json
            mobile/package-lock.json
      - name: Install back-end deps
        working-directory: back-end
        run: npm ci
      - name: Typecheck back-end
        working-directory: back-end
        run: npx tsc --noEmit -p tsconfig.json
      - name: Install mobile deps
        working-directory: mobile
        run: npm ci
      - name: Typecheck mobile
        working-directory: mobile
        run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            back-end/package-lock.json
            mobile/package-lock.json
      - name: Install back-end deps
        working-directory: back-end
        run: npm ci
      - name: Lint back-end
        working-directory: back-end
        run: npm run lint
      - name: Install mobile deps
        working-directory: mobile
        run: npm ci
      - name: Lint mobile
        working-directory: mobile
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            back-end/package-lock.json
            mobile/package-lock.json
      - name: Install back-end deps
        working-directory: back-end
        run: npm ci
      - name: Test back-end
        working-directory: back-end
        run: npm run test
      - name: Install mobile deps
        working-directory: mobile
        run: npm ci
      - name: Test mobile
        working-directory: mobile
        run: npm run test
