version: '3.9'

services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: econexa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: senha_secreta
      POSTGRES_DB: mutira_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d mutira_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: econexa-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: econexa-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local']
      interval: 10s
      timeout: 5s
      retries: 5

  minio-bucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: econexa-minio-bucket
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-econexa-evidencias} &&
      mc anonymous set download local/${MINIO_BUCKET:-econexa-evidencias}
      "

  mailpit:
    image: axllent/mailpit:v1.22
    container_name: econexa-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_MAX_MESSAGES: 500
    ports:
      - '1025:1025'
      - '8025:8025'
    volumes:
      - mailpit_data:/data

  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    container_name: econexa-backend
    restart: unless-stopped
    env_file:
      - ./back-end/.env
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://admin:senha_secreta@postgres:5432/mutira_db
      CORS_ORIGINS: http://localhost:19006,http://localhost:3000
      JWT_SECRET: changeme_super_secret_key_123
      APP_PUBLIC_URL: http://localhost:19006
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-econexa-evidencias}
      MINIO_PUBLIC_URL: http://localhost:9000
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: Mutira <nao-responda@mutira.local>
      SMTP_DEV_INBOX: caixa-dev@mutira.local
      SMTP_ALLOW_EXTERNAL: 'false'
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - ./back-end:/app
      - /app/node_modules

  mobile:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    container_name: econexa-mobile
    restart: unless-stopped
    working_dir: /app
    ports:
      - '19006:19006'
      - '19001:19001'
      - '19002:19002'
    environment:
      EXPO_PUBLIC_API_URL: http://localhost:5000/api
    volumes:
      - ./mobile:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
  mailpit_data:
