version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: mutira-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: senha_secreta
      POSTGRES_DB: mutira_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mutira-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
