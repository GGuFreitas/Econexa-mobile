name: mutira

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMINIO_API: ${DOMINIO_API:?defina DOMINIO_API}
      DOMINIO_ARQUIVOS: ${DOMINIO_ARQUIVOS:?defina DOMINIO_ARQUIVOS}
    volumes:
      - ./infra/producao/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_started
      minio:
        condition: service_healthy

  postgres:
    image: postgis/postgis:15-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mutira_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD}
      MINIO_BROWSER: 'off'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local']
      interval: 10s
      timeout: 5s
      retries: 5

  minio-bucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-econexa-evidencias}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing \"local/$$MINIO_BUCKET\" &&
      mc anonymous set download \"local/$$MINIO_BUCKET\"
      "

  migracoes:
    build:
      context: ./back-end
      dockerfile: Dockerfile.prod
    image: mutira-backend:latest
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mutira_db}
    command: ['npm', 'run', 'migrate:prod']
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: mutira-backend:latest
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mutira_db}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-econexa-evidencias}
      MINIO_PUBLIC_URL: https://${DOMINIO_ARQUIVOS}
    depends_on:
      migracoes:
        condition: service_completed_successfully
      minio-bucket:
        condition: service_completed_successfully

  postgres-backup:
    image: postgis/postgis:15-3.4
    restart: unless-stopped
    command: ['bash', '/backup/agendador.sh']
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-mutira_db}
      TZ: America/Sao_Paulo
      BACKUP_DIR: /backups
      BACKUP_HORARIO: ${BACKUP_HORARIO:-03:00}
      BACKUP_RETENCAO_DIAS: ${BACKUP_RETENCAO_DIAS:-14}
      BACKUP_AO_INICIAR: 'true'
    volumes:
      - ./infra/backup:/backup:ro
      - postgres_backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'find /backups -maxdepth 1 -type f -name "*.dump" -mmin -1560 | grep -q .']
      interval: 10m
      timeout: 30s
      start_period: 10m
      retries: 1
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  postgres_backups:
  caddy_data:
  caddy_config:
